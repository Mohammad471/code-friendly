<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Code-Friendly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css?v=2026072501" rel="stylesheet">
</head>
<body data-page="login">
  <div id="site-nav"></div>
  <main class="auth-shell">
    <div class="container">
      <div class="auth-panel form-panel">
        <h1 class="h3 fw-bold">Welcome back</h1>
        <p class="text-muted-soft">Demo login: student@codefriendly.dev / password123</p>
        <form id="loginForm" class="d-grid gap-3">
          <div>
            <label for="email" class="form-label">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="password" class="form-label">Password</label>
            <input class="form-control" id="password" name="password" type="password" required>
          </div>
          <button class="btn btn-primary btn-icon justify-content-center" type="submit"><i class="bi bi-box-arrow-in-right"></i><span>Login</span></button>
          <button class="btn btn-outline-primary btn-icon justify-content-center" id="demoLoginBtn" type="button"><i class="bi bi-lightning-charge"></i><span>Try Demo Account</span></button>
          <a href="register.html" class="text-center">Create a learner account</a>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js?v=2026072501"></script>
  <script src="pages.js?v=2026072501"></script>
</body>
</html>
