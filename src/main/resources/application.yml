server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: code-friendly-backend
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGO_CLUSTER_URL:mongodb://localhost:27017/codefriendly}
      database: ${MONGO_DATABASE:codefriendly}

app:
  jwt:
    secret: ${CODE_FRIENDLY_JWT_SECRET:code-friendly-dev-secret-change-this-before-production-2026}
    expiration-minutes: ${CODE_FRIENDLY_JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CODE_FRIENDLY_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:8080,file://}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
