<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | Code-Friendly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css?v=2026072501" rel="stylesheet">
</head>
<body data-page="admin">
  <div id="site-nav"></div>

  <main class="page-pad">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">Admin Dashboard</h1>
          <p class="text-muted-soft mb-0">Manage skills, modules, concepts, and users.</p>
        </div>
        <button class="btn btn-primary btn-icon"><i class="bi bi-plus-lg"></i><span>Add Skill</span></button>
      </div>

      <div class="row g-4">
        <div class="col-lg-3">
          <div class="cf-card">
            <div class="card-body">
              <ul class="nav flex-column gap-2">
                <li class="nav-item">
                  <a class="nav-link active fw-bold" href="#"><i class="bi bi-grid-3x3-gap me-2"></i>Skills & Modules</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#"><i class="bi bi-book me-2"></i>Concepts & Topics</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#"><i class="bi bi-ui-checks me-2"></i>Quizzes & Practice</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#"><i class="bi bi-people me-2"></i>Users & Progress</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
        
        <div class="col-lg-9">
          <div class="cf-card">
            <div class="card-body">
              <h2 class="h5 mb-4">Manage Skills</h2>
              <div class="table-responsive">
                <table class="table align-middle">
                  <thead>
                    <tr>
                      <th>Skill Name</th>
                      <th>Category</th>
                      <th>Modules</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="adminSkillsTable">
                    <tr>
                      <td><strong>Java</strong></td>
                      <td>Beginner</td>
                      <td>5</td>
                      <td>
                        <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                      </td>
                    </tr>
                    <tr>
                      <td><strong>Python</strong></td>
                      <td>Beginner</td>
                      <td>3</td>
                      <td>
                        <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer mt-auto py-3 bg-light">
    <div class="container text-center">
      <span class="text-muted">Code-Friendly Admin Panel</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js?v=2026072501"></script>
  <script src="pages.js?v=2026072501"></script>
</body>
</html>
