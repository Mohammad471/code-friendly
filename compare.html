<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Compare | Code-Friendly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css?v=2026072501" rel="stylesheet">
</head>
<body data-page="compare">
  <div id="site-nav"></div>
  <main class="page-pad">
    <div class="container">
      <div class="mb-4">
        <h1 class="display-6 fw-bold">Smart Compare Mode</h1>
        <p class="text-muted-soft mb-0">Select one skill for normal topic view or multiple skills for side-by-side comparison.</p>
      </div>
      <form class="surface mb-4" id="compareForm">
        <div class="row g-3 align-items-end">
          <div class="col-lg-4">
            <label class="form-label" for="conceptCompareSelect">Concept</label>
            <select class="form-select" id="conceptCompareSelect">
              <option value="arrays">Arrays</option>
              <option value="variables">Variables</option>
              <option value="data-types">Data Types</option>
              <option value="operators">Operators</option>
              <option value="loops">Loops</option>
              <option value="functions">Functions</option>
              <option value="strings">Strings</option>
              <option value="collections">Collections</option>
              <option value="recursion">Recursion</option>
              <option value="oop">OOP</option>
              <option value="exception-handling">Exception Handling</option>
            </select>
          </div>
          <div class="col-lg-6">
            <label class="form-label">Skills</label>
            <div class="btn-group flex-wrap" role="group" id="skillComparePicker"></div>
          </div>
          <div class="col-lg-2">
            <button class="btn btn-primary w-100 btn-icon justify-content-center" type="submit"><i class="bi bi-columns-gap"></i><span>Compare</span></button>
          </div>
        </div>
      </form>
      <div id="compareResult"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js?v=2026072501"></script>
  <script src="pages.js?v=2026072501"></script>
</body>
</html>
