<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Code-Friendly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css?v=2026072501" rel="stylesheet">
</head>
<body data-page="register">
  <div id="site-nav"></div>
  <main class="auth-shell">
    <div class="container">
      <div class="auth-panel form-panel">
        <h1 class="h3 fw-bold">Create learner account</h1>
        <p class="text-muted-soft">After registration, you will complete profile, choose year, choose goal, choose skills, and open your dashboard.</p>
        <form id="registerForm" class="d-grid gap-3">
          <div>
            <label for="name" class="form-label">Name</label>
            <input class="form-control" id="name" name="name" required>
          </div>
          <div>
            <label for="email" class="form-label">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
          </div>
          <div>
            <label for="password" class="form-label">Password</label>
            <input class="form-control" id="password" name="password" type="password" minlength="6" required>
          </div>
          <button class="btn btn-primary btn-icon justify-content-center" type="submit"><i class="bi bi-person-plus"></i><span>Register</span></button>
          <a href="login.html" class="text-center">Already have an account? Login</a>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js?v=2026072501"></script>
  <script src="pages.js?v=2026072501"></script>
</body>
</html>
